server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy every API call to llm-service, same-origin from the browser's
    # point of view. "llm-service" resolves via Docker's embedded DNS when
    # this container shares a network with it (see ../docker-compose.yml)
    # -- if you're serving this frontend standalone against an llm-service
    # running elsewhere, change the proxy_pass target below.
    location /api/ {
        proxy_pass http://llm-service:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/v1/generate/stream is NDJSON, flushed line-by-line by
        # llm-service -- buffering here would hold the whole response
        # until it closes, defeating the point of streaming progress
        proxy_buffering off;
    }

    # SPA fallback -- client-side routing (none yet, but harmless to have)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
